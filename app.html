let current=0,group=0,tick,remaining=60;const $=id=>document.getElementById(id);const home=$('home');games.forEach((g,i)=>{const el=document.createElement('div');el.className='tile';el.innerHTML='<span class="art">'+g[1]+'</span><h3>'+g[0]+'</h3><p>'+g[2]+'</p>';el.onclick=()=>openGame(i);home.appendChild(el)});function openGame(i){if(vaultState.closed){alert('خزنة سارة مغلقة حاليًا 🔐');return}if(vaultState.locked[i]&&(vaultState.owner||!vaultState.unlocked)){if(vaultState.owner){alert('🔐 هذا المجلد مقفل. افتحه من لوحة الإدارة أولًا.');return}const pin=prompt('🔐 أدخل الرقم السري الموحد');if(pin)unlockVault(pin,i);return}current=i;group=0;home.classList.add('hidden');$('panel').classList.remove('hidden');$('game').classList.add('hidden');$('start').classList.remove('hidden');$('title').textContent=games[i][1]+' '+games[i][0];$('description').textContent=games[i][2];$('rules').innerHTML=(i===11?['اختر أحد الأقسام الثلاثة، ثم رقمًا أو اختيارًا عشوائيًا.','كل الأقسام فيها تحديات متنوعة.','الأرقام المستخدمة تُشطب حتى إعادة الجولة.']:['اختاروا لاعبًا يشارك عبر المايك.','اسحب بطاقة عشوائية واقرأ المطلوب.','لا تتكرر البطاقة خلال الجولة؛ استخدم إعادة الجولة للبدء من جديد.']).map(s=>'<li>'+s+'</li>').join('');scrollTo(0,0)}function back(){endGame()}function endGame(){if(!confirm('تبي تنهي اللعبة وترجع للصفحة الرئيسية؟'))return;clearInterval(tick);tick=null;remaining=60;$('game').classList.add('hidden');$('panel').classList.add('hidden');$('start').classList.remove('hidden');$('prompt').textContent='';home.classList.remove('hidden');refreshVault()}function start(){$('start').classList.add('hidden');$('game').classList.remove('hidden');render();next()}function key(){return 'sara-vault-used-'+current}function used(){try{return JSON.parse(localStorage.getItem(key())||'[]')}catch{return []}}function save(a){localStorage.setItem(key(),JSON.stringify(a))}function pool(){return games[current][3]}function render(){const u=used();$('stat').textContent='المتبقي: '+(pool().length-u.length)+' من '+pool().length;$('sections').innerHTML=current===11?[0,1,2].map((n)=>'<button class="'+(group===n?'':'alt')+'" onclick="group='+n+';render()">'+(n*100+1)+'–'+((n+1)*100)+'</button>').join(''):'';$('numbers').innerHTML=current===11?Array.from({length:100},(_,n)=>{let i=group*100+n;return '<button class="'+(u.includes(i)?'used alt':'')+'" onclick="pick('+i+')">'+(i+1)+'</button>'}).join(''):'';$('clock').textContent=remaining}function pick(i){const u=used();$('prompt').textContent=(current===11?'رقم '+(i+1)+' — ':'')+pool()[i];if(!u.includes(i)){u.push(i);save(u)}render()}function next(){const u=used();const options=pool().map((_,i)=>i).filter(i=>!u.includes(i));if(!options.length){$('prompt').textContent='🎉 انتهت جميع البطاقات! اضغط إعادة الجولة';return}pick(options[0])}function reset(){if(confirm('تبي تعيد الجولة وتمسح الأرقام المستخدمة؟')){save([]);remaining=60;clearInterval(tick);const p=pool();for(let i=p.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=p[i];p[i]=p[j];p[j]=t}render();$('prompt').textContent='جاهزين للجولة الجديدة!'}}function timer(){clearInterval(tick);remaining=current===9?5:60;render();tick=setInterval(()=>{remaining--;render();if(remaining<=0){clearInterval(tick);$('clock').textContent='⏰ انتهى الوقت!'}},1000)} let vaultState={closed:false,locked:Array(12).fill(false),owner:false,unlocked:false};async function api(path,body){const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,credentials:'same-origin',cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error||'تعذر الاتصال');return j}async function refreshVault(){try{vaultState=await api('status');document.querySelectorAll('.tile').forEach((e,i)=>{e.style.opacity=vaultState.locked[i]&&(vaultState.owner||!vaultState.unlocked)?'.55':'1';e.title=vaultState.locked[i]?'🔐 مقفل':''});if(vaultState.closed){home.classList.add('hidden');$('panel').classList.add('hidden');$('vaultClosed').classList.remove('hidden')}else{$('vaultClosed').classList.add('hidden');if($('panel').classList.contains('hidden'))home.classList.remove('hidden')}}catch(e){home.classList.add('hidden');$('vaultClosed').classList.remove('hidden');$('vaultClosed').textContent='⚠️ تعذر الاتصال بنظام الحماية. حاول لاحقًا'}}async function unlockVault(pin,i){try{await api('unlock',{pin});await refreshVault();openGame(i)}catch(e){alert(e.message)}}async function adminInfo(){if(!vaultState.owner){const password=prompt('👑 كلمة مرور المالك');if(!password)return;try{await api('login',{password});await refreshVault()}catch(e){return alert(e.message)}}const p=document.getElementById('vaultAdmin');p.classList.remove('hidden');home.classList.add('hidden');$('panel').classList.add('hidden');renderAdmin()}function renderAdmin(){const p=document.getElementById('vaultAdmin');p.innerHTML='<h2>👑 لوحة إدارة خزنة سارة</h2><label><input id="closeSite" type="checkbox" '+(vaultState.closed?'checked':'')+'> إغلاق الخزنة بالكامل</label><h3>قفل المجلدات</h3>'+games.map((g,i)=>'<label style="display:block;padding:4px"><input class="lockFolder" data-i="'+i+'" type="checkbox" '+(vaultState.locked[i]?'checked':'')+'> 🔐 '+g[0]+'</label>').join('')+'<input id="newPin" type="password" minlength="4" placeholder="رقم سري موحد جديد (اختياري)" style="padding:12px;max-width:100%;margin:8px"><div><button onclick="saveAdmin()">💾 حفظ الإعدادات</button><button class="alt" onclick="closeAdmin()">رجوع</button><button class="alt" onclick="logoutAdmin()">خروج المالك</button></div>'}async function saveAdmin(){const locked=Array.from(document.querySelectorAll('.lockFolder')).map(e=>e.checked);const closed=document.getElementById('closeSite').checked;const pin=document.getElementById('newPin').value;if(locked.some(Boolean)&&!vaultState.pinConfigured&&!pin){alert('حدد رقمًا سريًا موحدًا أولًا حتى تقدر تقفل المجلدات');document.getElementById('newPin').focus();return}try{await api('admin',{locked,closed,...(pin?{pin}:{})});await refreshVault();alert(closed?'تم إغلاق خزنة سارة للجميع 🔒':locked.some(Boolean)?'تم قفل المجلدات المحددة 🔐':'تم حفظ الإعدادات');renderAdmin()}catch(e){alert(e.message)}}function closeAdmin(){document.getElementById('vaultAdmin').classList.add('hidden');refreshVault()}async function logoutAdmin(){await api('logout',{});closeAdmin()}refreshVault();setInterval(()=>{if(document.visibilityState==='visible')refreshVault()},5000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshVault()});</script></body></html>
