><p id="description"></p><details open><summary>📖 شرح اللعبة</summary><ul id="rules"></ul></details><div id="game" class="hidden"><div id="stat"></div><div id="prompt" class="prompt"></div><div id="sections"></div><div id="numbers" class="numbers"></div><button onclick="next()">التالي <span aria-hidden="true">←</span></button><button class="alt" onclick="reset()">🔄 إعادة الجولة</button><div id="timerbox"><h2 id="clock"></h2><button onclick="timer()">⏱ بدء المؤقت</button><button class="alt" onclick="clearInterval(tick)">إيقاف</button></div></div><button id="start" onclick="start()">▶ ابدأ اللعب</button></section></main><footer>خزنة سارة ✦ الإصدار التجريبي</footer><script>const games=[["كرسي الاعتراف","🪑","جاوب بصراحة أو استخدم فرصة التجاوز",["وش أطرف عذر قلته عشان ما تطلع؟","متى ضحكت في وقت غلط؟","وش أغرب شيء اشتريته وندمت؟","وش أكثر موقف ارتبكت فيه؟","مين آخر شخص أرسلت له رسالة بالغلط؟"]],["ممنوع تقول نعم أو لا","🚫","جاوب بسرعة بدون الكلمتين",["تحب القهوة؟","قد نمت عن موعد؟","عندك جوال؟","تقدر تعيش يوم بدون إنترنت؟","تحب المفاجآت؟"]],["الاختيار المستحيل","⚖️","اختر أحد الخيارين وقل السبب",["تغني أمام الجميع أو ترقص عشر ثوانٍ؟","تعيش بلا قهوة أسبوع أو بلا جوال يوم؟","تضحك في اجتماع أو تنام في عرس؟","تنسى اسم صديقك أو تنادي مديرك باسم غلط؟"]],["مين فينا؟","👥","رشّح واحدًا من الموجودين",["مين فينا يضيع ومعه خرائط؟","مين فينا يضحك قبل نهاية النكتة؟","مين فينا يتأخر عن كل موعد؟","مين فينا يسوي نفسه فاهم؟"]],["محكمة سارة","⚖️","اختاروا قاضيًا ومحاميًا ومتهمًا",["المتهم أكل آخر قطعة حلى وأنكر، دافع عنه!","المتهم اختفى وقت تنظيف الاستراحة، حاكموه!","المتهم يرسل فويس عشر دقائق بدل كلمة، حاكموه!","المتهم يقول بالطريق وهو ما طلع من البيت، حاكموه!"]],["جاوب بالعكس","🔄","جاوب إجابة غلط متعمدة بسرعة",["وش لون السماء؟","كم رجل عند الإنسان؟","وين نحط الثلج؟","وش نسوي بالمفتاح؟","كم يوم بالأسبوع؟"]],["الصندوق الأسود","🎁","افتح صندوقًا ونفّذ المفاجأة",["قلّد صوت مذيع أخبار لمدة 20 ثانية","سو إعلانًا مضحكًا عن كوب ماء","تكلم بصوت روبوت نصف دقيقة","مثّل إنك نسيت اسم اللي قدامك","قل جمل (){if(confirm('تبي تعيد الجولة وتمسح الأرقام المستخدمة؟')){save([]);remaining=60;clearInterval(tick);const p=pool();for(let i=p.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=p[i];p[i]=p[j];p[j]=t}render();$('prompt').textContent='جاهزين للجولة الجديدة!'}}function timer(){clearInterval(tick);remaining=current===9?5:60;render();tick=setInterval(()=>{remaining--;render();if(remaining<=0){clearInterval(tick);$('clock').textContent='⏰ انتهى الوقت!'}},1000)}</script></body></html>
